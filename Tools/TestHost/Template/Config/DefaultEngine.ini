; DreamNarrative test host -- engine config.
;
; The host stands in for DevTest (I:\UnrealProject_Moon\DEV_58\DevTest), the project DreamNarrative is
; developed in. Every section says where it came from. Values taken from DevTest's DefaultEngine.ini
; are copied verbatim because several of them feed the shader cache keys: a host that agrees with
; DevTest on them reads DevTest's already-warm derived data cache the day someone opens it with a real
; RHI, instead of compiling every shader again. The test runs themselves use -nullrhi and compile none.
;
; There is deliberately no derived-data-cache section. On this engine the cache that is read and
; written is the local Zen store, which is machine-wide rather than per project; leaving the cache
; graph alone is exactly what makes the host share DevTest's.

[/Script/EngineSettings.GameMapsSettings]
; The lightest map the engine ships: one PlayerStart. The narrative tests need a world and a game
; instance, not anything in the world; DevTest starts on a full showcase level every run would load.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry

[/Script/Engine.RendererSettings]
; Copied verbatim from DevTest. These feed the shader map keys.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.EarlyZPassOnlyMaterialMasking=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.CustomDepth=3
r.RayTracing.Shadows=True
r.Mobile.AntiAliasing=4
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Copied from DevTest: the RHI and the targeted shader formats decide the shader platform, which is
; part of every shader cache key.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.MoonToonSettings]
; This engine's toon subsystem loads two ramp atlases at startup from DevTest's own MoonToon project
; plugin, which the host does not carry. None skips the load instead of logging two failures a run.
GlobalDiffuseColorRampAtlas=None
GlobalSpecularColorRampAtlas=None
